<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartHealth Profile</title>

<link rel="stylesheet" href="css/profile.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<div class="profile-container">


<h1>
👤 My Health Profile
</h1>


<div class="profile-card">


<form id="profileForm">


<label>
Full Name
</label>

<input 
type="text" 
id="name"
placeholder="Enter your name"
>



<label>
Age
</label>

<input 
type="number" 
id="age"
placeholder="Enter your age"
>



<label>
Blood Group
</label>

<input 
type="text"
id="blood"
placeholder="Example: O+"
>



<label>
Height (cm)
</label>

<input 
type="number"
id="height"
placeholder="Enter height"
>



<label>
Weight (kg)
</label>

<input 
type="number"
id="weight"
placeholder="Enter weight"
>



<label>
Allergies
</label>

<textarea 
id="allergy"
placeholder="Enter allergies">
</textarea>



<label>
Emergency Contact
</label>

<input
type="tel"
id="contact"
placeholder="Phone number"
>



<button type="submit">

Save Profile

</button>


</form>


</div>


<div class="display-card">

<h2>
Saved Information
</h2>


<p id="displayData">
No data saved yet.
</p>


</div>



</div>



<script src="js/profile.js"></script>

</body>

</html>
